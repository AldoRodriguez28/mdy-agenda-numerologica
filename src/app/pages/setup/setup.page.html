<mat-card class="card">
  <mat-card-header>
    <mat-card-title>Crear Agenda Numerológica Personal</mat-card-title>
    <mat-card-subtitle>Ingresa tus datos para generar portada y cálculos.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" class="grid" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Nombre completo</mat-label>
        <input matInput formControlName="fullName" autocomplete="name" />
        <mat-error *ngIf="form.controls.fullName.invalid && form.controls.fullName.touched">
          Ingresa un nombre válido.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Fecha de nacimiento</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="birthDate" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="form.controls.birthDate.invalid && form.controls.birthDate.touched">
          Selecciona tu fecha de nacimiento.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Diseño</mat-label>
        <mat-select formControlName="themeId">
          <mat-option *ngFor="let t of themes" [value]="t.value">{{ t.label }}</mat-option>
        </mat-select>
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>Año a calcular</mat-label>
        <input matInput type="number" formControlName="targetYear" />
        <mat-error *ngIf="form.controls.targetYear.invalid && form.controls.targetYear.touched">
          Ingresa un año válido.
        </mat-error>
      </mat-form-field>
      
      <div class="photo">
        <label class="photo-label">
          <input type="file" accept="image/*" (change)="onFile($event)" />
          <span>Subir foto (opcional)</span>
        </label>

        <div class="preview" *ngIf="photoDataUrl">
          <img [src]="photoDataUrl" alt="Foto personal" />
        </div>

        <div class="preview placeholder" *ngIf="!photoDataUrl">
          <span>Sin foto</span>
        </div>
      </div>

      <div class="actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
          Generar agenda
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
